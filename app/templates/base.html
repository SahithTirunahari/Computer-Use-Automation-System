<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Member Search{% endblock %} | Member Service Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('search') }}">Member Service Portal</a>
            <span class="environment">Local demo · Fake data only</span>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container">Internal Member Lookup · Demonstration environment</footer>
</body>
</html>
